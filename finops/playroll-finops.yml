meters:
- name: eor_employees
  description: Full-time employees hired via Playroll EOR, billed flat PEPM.
  unit: employees
  aggregation: sum
  dimensions:
  - account
  - country
  - entity
- name: contractors
  description: Contractors managed via Playroll, billed flat per contractor per month.
  unit: contractors
  aggregation: sum
  dimensions:
  - account
  - country
- name: global_payroll_employees
  description: Employees run through Playroll Global Payroll, billed PEPM.
  unit: employees
  aggregation: sum
  dimensions:
  - account
  - country
  - entity
- name: security_deposits
  description: Refundable security deposit (approximately one month's salary) held per EOR employee at onboarding.
  unit: deposits
  aggregation: sum
  dimensions:
  - account
  - employee
- name: pass_through_costs
  description: Salaries, statutory contributions, and benefits paid through Playroll per worker.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - country
  - worker
principles:
- name: Visibility
  description: Pull Playroll invoices and per-worker PEPM breakdowns; separate platform fees from pass-through salary/statutory costs.
- name: Allocation
  description: Tag workers by team, country, and entity; map EOR vs contractor vs own-payroll spend to cost centers.
- name: Optimization
  description: Choose the right engagement model per role (contractor vs EOR vs own-entity payroll); consolidate countries; right-size headcount; recover refundable deposits on offboarding.
- name: Accountability
  description: Assign owners per country/entity; review monthly PEPM and pass-through spend against workforce budget.
