description: >-
  FinOps view of Playroll spend. Playroll is billed as global-employment SaaS
  on a per-employee-per-month (PEPM) basis - a flat monthly fee per EOR
  employee, a flat monthly fee per contractor, and a small PEPM fee for
  Global Payroll - plus salary, statutory contributions, and a refundable
  security deposit passed through per worker. This is workforce/HR spend, not
  metered API-usage spend: there is no public per-call API billing. Cost
  optimization is about worker mix (EOR vs contractor vs own-entity payroll),
  country selection, and headcount rather than request volume.
notes: >-
  PEPM rates are representative and subject to change; a refundable security
  deposit (approximately one month's salary) applies on EOR onboarding.
  Confirm against Playroll's pricing pages and your contract during
  reconciliation. No API-usage meters exist because there is no public
  metered API.
