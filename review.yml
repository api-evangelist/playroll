  - url: https://www.playroll.com/partners
    type: Documentation
    note: Five partnership tracks incl. "API Integration"; Silver tier "Sandbox & documentation provided"; Gold "Solutions-engineering hours"; Platinum "Custom integration roadmap."
  - url: https://www.playroll.com/employer-of-record
    type: Documentation
    note: EOR product - local payroll, benefits, HRIS integration, employee documents.
  - url: https://www.playroll.com/white-label-hr-software
    type: Documentation
    note: White-label / reseller HR software for payroll & EOR services.
  - url: https://www.playroll.com/pricing/employer-of-record
    type: Pricing
    note: EOR / contractor / global payroll PEPM pricing (see plans artifact).
  - url: https://github.com/playroll
    type: GitHubOrganization
    note: Returns HTTP 404 - no public Playroll GitHub organization found; GitHubOrganization common property intentionally omitted.
actions:
  openapiPath: null
  apisYmlUpdated: true
  reason: |
    Built a company-level catalog entry with five modeled API entries
    reflecting Playroll's EOR, contractor, global payroll, workforce-data,
    and partner-integration surfaces. Omitted openapi/ and GitHubOrganization
    because neither a public API reference nor a public GitHub org exists.
    Documented the partner/enterprise-gated availability state honestly here
    and in apis.yml descriptions, and shipped Postman + Open Collection
    scaffolds clearly marked as partner-completable rather than verified.
