aid: playroll
url: https://raw.githubusercontent.com/api-evangelist/playroll/refs/heads/main/apis.yml
name: Playroll
kind: company
description: Playroll is a global HR platform providing Employer of Record (EOR),
  contractor management, and global payroll across 180+ countries. It runs local
  payroll, statutory benefits, and compliance for distributed teams, and offers a
  partner/enterprise integration surface - native HRIS connectors (HiBob, BambooHR),
  an "Open API" for bi-directional HR data sync, and custom/embedded integration
  builds. The developer API is partner- and enterprise-gated; sandbox access and
  documentation are provided to integration partners rather than published on a
  public developer portal.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
